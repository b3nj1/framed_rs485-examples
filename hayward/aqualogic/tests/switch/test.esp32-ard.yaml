packages:
  common: !include common.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino

external_components:
  - source: github://b3nj1/esphome@v4.6.0
    components: [rs485_frame]

uart:
  id: pool_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 2
