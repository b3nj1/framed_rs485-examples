# Standalone config-validation harness for switch.yaml / switch_secondary.yaml, plus the
# fused Heater Mode switch in heater.yaml. Not a user-facing example -- see this
# directory's own README.md. Exercises the bit-based case (Lights, via switch.yaml), the
# secondary/wired-local wire format (Service, via switch_secondary.yaml), and heater.yaml's
# own fused switch (Heater Mode, which reads heater_auto's already-latched state rather
# than a bit).
substitutions:
  name: rs485-frame-switch-test
  cmd_preamble: [0x00, 0x83, 0x01]
  cmd_postamble: [0x00]
  cmd_element_bytes: "1"
  cmd_endian: "big"
  secondary_cmd_preamble: [0x00, 0x02]
  secondary_cmd_postamble: []
  secondary_cmd_element_bytes: "1"

esphome:
  name: ${name}

logger:

packages:
  bus: !include ../../bus.yaml
  heater: !include ../../heater.yaml
  switch_lights: !include
    file: ../../switch.yaml
    vars:
      switch_name: "Lights"
      bit: "6"
      switch_command: [0x00, 0x01, 0x00, 0x00, 0x00, 0x01, 0x00, 0x00]
  switch_service: !include
    file: ../../switch_secondary.yaml
    vars:
      switch_name: "Service"
      bit: "9"
      switch_command: [0x08, 0x00, 0x08, 0x00]
      disabled_by_default: "true"
