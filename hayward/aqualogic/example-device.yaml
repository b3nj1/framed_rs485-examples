# =============================================================================
# Hayward AquaLogic / ProLogic — example device config
# -----------------------------------------------------------------------------
# Role:        device config with remote packages
# Status:      tested-on-hardware
# Tested on:   Hayward AquaLogic / ProLogic; ESP32-S3 (Waveshare ESP32-S3-RS485-CAN)
#
# Contributors:
#   - b3nj1 (@b3nj1)
# =============================================================================
#
# HOW TO USE THIS FILE
#   1. Copy it to your ESPHome configuration directory and rename it (the name
#      becomes your device's hostname).
#   2. Fill in all substitutions: (name, GPIO pins, transmit role, ...) and
#      esp32: (board, variant, ...) below.
#   3. In the packages.rs485.files list, uncomment the optional packages you have
#      (pump-vsp.yaml, heater.yaml). The bus.yaml line is REQUIRED — leave it
#      uncommented. LED and button entries are already active; rename labels to
#      match your load, and remove entries for gear your system doesn't have.
#      Equipment-specific LEDs and buttons are hidden in HA by default — enable
#      them in Settings > Entities once you know which ones apply to you.
#   4. Add wifi_ssid / wifi_password to your secrets.yaml (remote packages cannot
#      contain !secret, so wifi/api/ota stay in this file).
#   5. Flash. Want the periodic diagnostic stats table (frame cadence, unique
#      payload counts) and/or per-frame raw logging? Uncomment the hayward/aqualogic/diagnostics.yaml line
#      in the packages.rs485.files list. Its tuning (capture size, how many
#      frame types/payloads to track, whether to enable frame dump) has defaults built in — to override any
#      of them, expand that one line into `path:` + `vars:` form, e.g.:
#        - path: hayward/aqualogic/diagnostics.yaml
#          vars: { stats_max_unique_payloads: 12, dump_frames_enable: "true" }
#      See diagnostics.yaml's own header for the full list of vars.
#
# To update to a newer release, bump packages.rs485.ref to a newer tag. To edit a
# decoder, copy the package files locally and switch to local !include (see README).

substitutions:
  name: aqualogic
  friendly_name: AquaLogic
  tx_pin: GPIOXX             # if no data received, try swapping tx_pin and rx_pin
  rx_pin: GPIOXX
  flow_control_pin: GPIOXX   # DE/RE direction pin; delete this and the uart: line below
                             # if your adapter auto-manages direction

  # Transmit role — pick ONE, set both cmd_preamble and cmd_postamble together
  # (see bus.yaml header for the full role table):
  #   Wireless (recommended): cmd_preamble: [0x00, 0x83, 0x01]  cmd_postamble: [0x00]
  #   Wired remote:           cmd_preamble: [0x00, 0x03]         cmd_postamble: []
  #   Wired local / main panel: cmd_preamble: [0x00, 0x02]       cmd_postamble: []
  #     WARNING: impersonates the main panel. Can collide with physical keypresses.
  #
  # (Why all four command_format knobs live here and not bus.yaml: ESPHome
  # concatenates list-valued substitutions from packages instead of overriding
  # them, so splitting this across two files would double the bytes.)

  # Primary wireless role substitutions (newer-firmware, usually "4-byte" values):
  cmd_preamble: [0x00, 0x83, 0x01]   # unquoted YAML list — wireless default
  cmd_postamble: [0x00]              # wireless trailing pad; wired uses []
  cmd_element_bytes: "1"             # 1 byte per value (byte-array form)
  cmd_endian: "big"                  # Hayward: big-endian
  # Secondary wire role substitutions (wired-local / legacy-firmware, usually 2-byte values):
  secondary_cmd_preamble: [0x00, 0x02]     # wired local frame — legacy-firmware / Service
  secondary_cmd_postamble: []
  secondary_cmd_element_bytes: "1"         # 1 byte per value (byte-array form)

  # Temperature units — passed to bus.yaml decoders.
  temp_unit: "°F"
  temp_unit_short: "F"

  # Display width in columns — passed to bus.yaml decoders. Legacy fw v2.85 uses "16"
  display_cols: "20"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# ESP-IDF is recommended: it enables hardware RS485 half-duplex mode on the UART
# peripheral, driving the DE/RE direction pin at the shift-register level without
# software guard times. Arduino-framework users must use an auto-DE transceiver
# chip (e.g. MAX13487, MAX22025) instead.
esp32:
  board: BOARDXX             # board/variant: see https://esphome.io/components/esp32
  variant: VARIANTXX
  framework:
    type: esp-idf

logger:
api:
ota:
  platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Temporary — while rs485_frame is unreleased this tracks the staging branch.
# Remove this block entirely once rs485_frame ships in an official ESPHome release.
external_components:
  - source: github://b3nj1/esphome@v3.0.2
    components: [rs485_frame]

# UART — Hayward AquaLogic / ProLogic: 19200 baud, 8N2; fixed by protocol.
uart:
  id: pool_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200  # Hayward AquaLogic — do not change
  data_bits: 8
  parity: NONE
  stop_bits: 2
  rx_buffer_size: 512
  flow_control_pin: ${flow_control_pin}

packages:
  rs485:
    url: https://github.com/b3nj1/rs485_frame-examples
    ref: v4.1.0          # PINNED release tag — bump deliberately to update (see README)
    refresh: 1d
    files:
      # Required package: stays uncommented.
      - hayward/aqualogic/bus.yaml

      # --- Equipment: uncomment the lines for gear you have, delete the rest. ---
      # - hayward/aqualogic/pump-vsp.yaml        # Variable-speed pump — Status: tested
      # - hayward/aqualogic/heater.yaml          # Gas/heat-pump heater — Status: tested
      # - hayward/aqualogic/diagnostics.yaml     # Diagnostic stats table + frame dump — Status: tested

      # --- LED indicators — rename labels to match your load; remove bits your panel lacks. ---
      # Enabled by default: states present on every AquaLogic panel.
      # Disabled by default (hidden in HA; enable in Settings > Entities as needed):
      #   AUX channels, valves, Service, Spillover, Super Chlorinate.
      # Bits 0-8 hardware-verified. Bits 9-25 confirmed by swilson, smith288, ChaseDurand.
      # Use the "LED Mask" diagnostic sensor to verify bit layout on your specific panel.
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 0, led_name: "Heater Active", device_class: heat }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 1, led_name: "Valve 3", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 2, led_name: "Check System", device_class: problem }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 3, led_name: "Pool Mode", device_class: running }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 4, led_name: "Spa Mode", device_class: running }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 5, led_name: "Filter", device_class: running }
      # Filter LED blinking (not solid) = pump running at low speed. Disabled by default --
      # only relevant if you have a variable-speed pump; enable in HA Settings > Entities.
      - path: hayward/aqualogic/blink_led.yaml
        vars: { bit: 5, led_name: "Pump Low Speed", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 6, led_name: "Lights", device_class: light }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 7, led_name: "AUX 1", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 8, led_name: "AUX 2", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 9, led_name: "Service", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 10, led_name: "AUX 3", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 11, led_name: "AUX 4", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 12, led_name: "AUX 5", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 13, led_name: "AUX 6", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 14, led_name: "Valve 4", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 15, led_name: "Spillover", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 16, led_name: "System Off", device_class: problem }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 17, led_name: "AUX 7", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 18, led_name: "AUX 8", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 19, led_name: "AUX 9", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 20, led_name: "AUX 10", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 21, led_name: "AUX 11", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 22, led_name: "AUX 12", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 23, led_name: "AUX 13", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 24, led_name: "AUX 14", device_class: running, disabled_by_default: "true" }
      - path: hayward/aqualogic/led.yaml
        vars: { bit: 25, led_name: "Super Chlorinate", device_class: running, disabled_by_default: "true" }

      # --- Buttons — rename labels to match your load; remove buttons your panel lacks. ---
      # Buttons below use the wireless format (works on most panels, our default).
      # If a menu/display button (Plus, Minus, Menu, Right, Left, Lights, Service)
      # doesn't respond, you likely have older firmware (e.g. v2.85): swap that
      # button to its commented-out secondary_button.yaml alternative below.
      # Full history: https://github.com/b3nj1/rs485_frame-examples/issues/3
      # Navigation and mode: active by default on every panel.
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "Filter", button_command: [0x80, 0x00, 0x00, 0x00, 0x80, 0x00, 0x00, 0x00] }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "Pool Spa Mode", button_command: [0x40, 0x00, 0x00, 0x00, 0x40, 0x00, 0x00, 0x00] }

      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "Plus", button_command: [0x20, 0x00, 0x00, 0x00, 0x20, 0x00, 0x00, 0x00] }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "Minus", button_command: [0x10, 0x00, 0x00, 0x00, 0x10, 0x00, 0x00, 0x00] }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "Menu", button_command: [0x02, 0x00, 0x00, 0x00, 0x02, 0x00, 0x00, 0x00] }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "Right", button_command: [0x01, 0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00] }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "Left", button_command: [0x04, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00] }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "Lights", button_command: [0x00, 0x01, 0x00, 0x00, 0x00, 0x01, 0x00, 0x00] }

      # Legacy fw v2.85 uses shorter wired-commands for Plus, Minus, Menu, Right, Left, Lights:
      # - path: hayward/aqualogic/secondary_button.yaml
      #   vars: { button_name: "Plus", button_command: [0x20, 0x00, 0x20, 0x00] }
      # - path: hayward/aqualogic/secondary_button.yaml
      #   vars: { button_name: "Minus", button_command: [0x10, 0x00, 0x10, 0x00] }
      # - path: hayward/aqualogic/secondary_button.yaml
      #   vars: { button_name: "Menu", button_command: [0x02, 0x00, 0x02, 0x00] }
      # - path: hayward/aqualogic/secondary_button.yaml
      #   vars: { button_name: "Right", button_command: [0x01, 0x00, 0x01, 0x00] }
      # - path: hayward/aqualogic/secondary_button.yaml
      #   vars: { button_name: "Left", button_command: [0x04, 0x00, 0x04, 0x00] }
      # - path: hayward/aqualogic/secondary_button.yaml
      #   vars: { button_name: "Lights", button_command: [0x00, 0x01, 0x00, 0x01] }

      # Menu Unlock — Hayward unlocks setup menus by holding Left+Right for several seconds,
      # not a quick press. Two buttons bracket the hold instead of one: "Start" sets the
      # Left+Right bits with nothing released (held), "End" releases them. Press Start, wait
      # a few seconds, then press End.
      # - path: hayward/aqualogic/button.yaml
      #   vars: { button_name: "Menu Unlock Start", button_command: [0x05, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] }
      # - path: hayward/aqualogic/button.yaml
      #   vars: { button_name: "Menu Unlock End", button_command: [0x00, 0x00, 0x00, 0x00, 0x05, 0x00, 0x00, 0x00] }

      # Service — wired local frame (0x0002), no postamble. Disabled by default:
      # maintenance use only; most users should not trigger this accidentally.
      - path: hayward/aqualogic/secondary_button.yaml
        vars: { button_name: "Service", button_command: [0x08, 0x00, 0x00, 0x00, 0x08, 0x00, 0x00, 0x00], disabled_by_default: "true" }
      # Legacy fw v2.85: Service button_command value only (uncomment the alternative below):
      #   vars: { button_name: "Service", button_command: [0x08, 0x00, 0x08, 0x00], disabled_by_default: "true" }

      # System Off — always wireless regardless of hub role.
      - path: hayward/aqualogic/button.yaml
        vars:
          button_name: "System Off"
          button_command: [0x08, 0x00, 0x00, 0x00, 0x08, 0x00, 0x00, 0x00]
          btn_preamble: [0x00, 0x83, 0x01]   # wireless — do not change
          btn_postamble: [0x00]
      # AUX relays and valves — disabled by default; enable in HA Settings > Entities.
      # Rename labels to match your load (e.g. "Pool Light", "Spa Jets", "Booster Pump").
      # AUX 1-2 hardware-tested. AUX 3-7 confirmed by swilson + smith288, not hw-tested.
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "AUX 1", button_command: [0x00, 0x02, 0x00, 0x00, 0x00, 0x02, 0x00, 0x00], disabled_by_default: "true" }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "AUX 2", button_command: [0x00, 0x04, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00], disabled_by_default: "true" }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "AUX 3", button_command: [0x00, 0x08, 0x00, 0x00, 0x00, 0x08, 0x00, 0x00], disabled_by_default: "true" }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "AUX 4", button_command: [0x00, 0x10, 0x00, 0x00, 0x00, 0x10, 0x00, 0x00], disabled_by_default: "true" }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "AUX 5", button_command: [0x00, 0x20, 0x00, 0x00, 0x00, 0x20, 0x00, 0x00], disabled_by_default: "true" }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "AUX 6", button_command: [0x00, 0x40, 0x00, 0x00, 0x00, 0x40, 0x00, 0x00], disabled_by_default: "true" }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "AUX 7", button_command: [0x00, 0x80, 0x00, 0x00, 0x00, 0x80, 0x00, 0x00], disabled_by_default: "true" }
      # AUX 8-14: command bytes are in an unusual byte position; swilson source only,
      # no independent wire-capture confirmation. Keep commented until hw-tested.
      # - path: hayward/aqualogic/button.yaml
      #   vars: { button_name: "AUX 8",  button_command: [0x00, 0x00, 0x08, 0x00, 0x00, 0x00, 0x08, 0x00], disabled_by_default: "true" }
      # - path: hayward/aqualogic/button.yaml
      #   vars: { button_name: "AUX 9",  button_command: [0x00, 0x00, 0x10, 0x00, 0x00, 0x00, 0x10, 0x00], disabled_by_default: "true" }
      # - path: hayward/aqualogic/button.yaml
      #   vars: { button_name: "AUX 10", button_command: [0x00, 0x00, 0x20, 0x00, 0x00, 0x00, 0x20, 0x00], disabled_by_default: "true" }
      # - path: hayward/aqualogic/button.yaml
      #   vars: { button_name: "AUX 11", button_command: [0x00, 0x00, 0x40, 0x00, 0x00, 0x00, 0x40, 0x00], disabled_by_default: "true" }
      # - path: hayward/aqualogic/button.yaml
      #   vars: { button_name: "AUX 12", button_command: [0x00, 0x00, 0x80, 0x00, 0x00, 0x00, 0x80, 0x00], disabled_by_default: "true" }
      # - path: hayward/aqualogic/button.yaml
      #   vars: { button_name: "AUX 13", button_command: [0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x01], disabled_by_default: "true" }
      # - path: hayward/aqualogic/button.yaml
      #   vars: { button_name: "AUX 14", button_command: [0x00, 0x00, 0x00, 0x02, 0x00, 0x00, 0x00, 0x02], disabled_by_default: "true" }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "Valve 3", button_command: [0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x01, 0x00], disabled_by_default: "true" }
      - path: hayward/aqualogic/button.yaml
        vars: { button_name: "Valve 4", button_command: [0x00, 0x00, 0x02, 0x00, 0x00, 0x00, 0x02, 0x00], disabled_by_default: "true" }
