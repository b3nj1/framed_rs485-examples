# =============================================================================
# Hayward AquaLogic / ProLogic — fused toggle-output switch package (secondary wire role)
# -----------------------------------------------------------------------------
# Role: package as template
#
# Mirrors switch.yaml but defaults to `${secondary_cmd_*}` substitutions instead
# of `${cmd_*}` — the wired-local preamble `[0x00, 0x02]`, typically needed for
# Service on legacy-firmware panels (main board v2.85 and similar). See
# switch.yaml's header for the full var reference; only the btn_* defaults
# differ here.
# =============================================================================

defaults:
  switch_name: "Switch (Secondary)"
  switch_id: "switch_secondary"
  bit: -1
  text_on: ""
  text_off: ""
  device_class: ""
  disabled_by_default: "false"
  btn_preamble: ${secondary_cmd_preamble}
  btn_postamble: ${secondary_cmd_postamble}
  btn_element_bytes: ${secondary_cmd_element_bytes}
  btn_endian: ${cmd_endian}

button:
  - platform: rs485_frame
    id: switch_${switch_id}_btn
    rs485_frame_id: pool
    internal: true
    value: ${switch_command}
    command_format:
      preamble: ${btn_preamble}
      value_element_bytes: ${btn_element_bytes}
      endian: ${btn_endian}
      postamble: ${btn_postamble}

switch:
  - platform: template
    id: switch_${switch_id}
    name: "${switch_name}"
    device_class: ${device_class}
    disabled_by_default: ${disabled_by_default}
    optimistic: true
    turn_on_action:
      - button.press: switch_${switch_id}_btn
    turn_off_action:
      - button.press: switch_${switch_id}_btn
    lambda: |-
      if (${bit} >= 0) {
        return bool(id(g_led_mask) & (1UL << ${bit}));
      }
      const std::string &txt = id(display_text).state;
      if (txt.find("${text_on}") != std::string::npos) return true;
      if (txt.find("${text_off}") != std::string::npos) return false;
      return {};
