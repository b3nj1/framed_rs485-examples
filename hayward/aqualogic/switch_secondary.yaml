# =============================================================================
# Hayward AquaLogic / ProLogic — fused toggle-output switch package (secondary wire role)
# -----------------------------------------------------------------------------
# Role: package as template
#
# Mirrors switch.yaml but defaults to `${secondary_cmd_*}` substitutions instead
# of `${cmd_*}` — the wired-local preamble `[0x00, 0x02]`, typically needed for
# Service on legacy-firmware panels (main board v2.85 and similar). See
# switch.yaml's header for the full var reference and the `restore_mode:
# DISABLED` rationale; only the btn_* defaults differ here.
# =============================================================================

defaults:
  switch_name: "Switch (Secondary)"
  device_class: ""
  disabled_by_default: "false"
  btn_preamble: ${secondary_cmd_preamble}
  btn_postamble: ${secondary_cmd_postamble}
  btn_element_bytes: ${secondary_cmd_element_bytes}
  btn_endian: ${cmd_endian}

# name: is set (not just id:) despite internal: true so response_monitor.yaml/_mask/_display's
# existing button_name: trigger form resolves this button the same way it would a plain
# button.yaml entry — internal: true alone already keeps it out of Home Assistant, so the name
# has no user-visible effect; it only exists as that join key.
button:
  - platform: rs485_frame
    id: switch_bit_${bit}_btn
    name: "${switch_name}"
    rs485_frame_id: pool
    internal: true
    value: ${switch_command}
    command_format:
      preamble: ${btn_preamble}
      value_element_bytes: ${btn_element_bytes}
      endian: ${btn_endian}
      postamble: ${btn_postamble}

switch:
  - platform: template
    id: switch_bit_${bit}
    name: "${switch_name}"
    device_class: ${device_class}
    disabled_by_default: ${disabled_by_default}
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - button.press: switch_bit_${bit}_btn
    turn_off_action:
      - button.press: switch_bit_${bit}_btn
    lambda: |-
      return bool(id(g_led_mask) & (1UL << ${bit}));
