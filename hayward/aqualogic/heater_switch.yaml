# =============================================================================
# Hayward AquaLogic / ProLogic — heater mode switch
# -----------------------------------------------------------------------------
# Role:        package (optional)
# Status:      UNTESTED-draft
# Tested on:   n/a — config-validated only, not yet run against real hardware
# Bus:         19200 baud, 8N2  (see bus.yaml)
# Owns frames: none of its own — reads the display text bus.yaml already decodes
# Offsets:     n/a
# References:  https://github.com/swilson/aqualogic
#
# Contributors:
#   - b3nj1 (@b3nj1) — capture, decode, packaging
# =============================================================================
#
# Fused Auto/Manual Off toggle for the heater, as one optimistic `switch:` entity
# instead of `heater.yaml`'s separate "Heater" button + "Heater Auto Mode"
# binary_sensor. Self-contained: only needs `bus.yaml` (required by every device
# config already), not `heater.yaml` — pick this file OR heater.yaml's
# button/binary_sensor pair for the mode toggle, not both, to avoid two entities
# doing the same thing. (heater.yaml's separate "Heater" binary_sensor for
# *active heating*, bit 0 of the LED mask, is a different concept and unaffected
# either way — this file doesn't touch it.)
#
# Turning the switch on or off sends the SAME toggle command either way — the
# panel has one toggle command, not separate on/off commands — via a hidden,
# internal `button:` entity built on the same `rs485_frame` button platform
# `button.yaml` uses, so the TX path (half-duplex gate, queue policy) is
# byte-identical to a real button press, not a reimplementation.
#
# The switch is `optimistic: true` for an immediate assumed-state publish on
# command, corrected by a `lambda:` polled every loop() tick. Heater mode isn't
# in the LED mask — it only appears on the cycling display — so the lambda
# substring-matches the "Heater Auto" / "Heater Manual Off" screen against
# bus.yaml's own `display_text` sensor, the same source `heater.yaml`'s
# on_frame handler scans. Unlike that handler, this lambda has no explicit
# revert-after-timeout: it simply doesn't publish anything on a tick where the
# current display screen isn't a heater screen, so the switch holds its last
# known state until the next heater screen actually confirms otherwise.
#
# `restore_mode: DISABLED` is required, not cosmetic: the template switch
# platform's default (`ALWAYS_OFF`) makes it call `turn_off()` — which fires
# `turn_off_action` and presses the internal button — from inside its own
# `setup()`, which runs at a higher setup_priority than the `rs485_frame` hub
# itself. That press would reach `queue_command_values()` before the hub's
# `setup()` has sized its TX queue, and would also send a real toggle command
# to the panel on every boot regardless. `DISABLED` skips both.
# =============================================================================

button:
  - platform: rs485_frame
    id: heater_switch_btn
    rs485_frame_id: pool
    internal: true
    value: [0x00, 0x00, 0x04, 0x00, 0x00, 0x00, 0x04, 0x00]  # toggles heater mode (Manual Off / Auto); 0x00000400 word x2, byte-expanded

switch:
  - platform: template
    name: "Heater Mode"
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - button.press: heater_switch_btn
    turn_off_action:
      - button.press: heater_switch_btn
    lambda: |-
      const std::string &txt = id(display_text).state;
      if (txt.find("Auto") != std::string::npos) return true;
      if (txt.find("Manual Off") != std::string::npos) return false;
      return {};
