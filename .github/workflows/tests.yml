name: tests

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/requirements-dev.txt
      - run: pytest

  validate-esphome-config:
    # Runs every entry-point example-device*.yaml through a real `esphome config`
    # (schema validation, no compile) so package-file bugs -- bad YAML structure, schema
    # violations, typos in package paths -- surface here instead of in a user's build.
    # Checks out the b3nj1/esphome fork's matching branch (falling back to its primary
    # branch) so this validates the component change actually being made, not last release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rs485_frame-examples
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # esphome requires >=3.12; the pytest job above doesn't install
                                   # esphome so it can stay on 3.11
      - name: Checkout matching esphome branch
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git clone --depth 1 --branch "$BRANCH" https://github.com/b3nj1/esphome.git esphome \
            || git clone --depth 1 --branch rs485_frame https://github.com/b3nj1/esphome.git esphome
      - run: pip install -e ./esphome
      - run: python3 tools/validate_examples.py --esphome-path "$GITHUB_WORKSPACE/esphome"
        working-directory: rs485_frame-examples
      - run: python3 tools/validate_switch_standalone.py --esphome-path "$GITHUB_WORKSPACE/esphome"
        working-directory: rs485_frame-examples
      - name: Check example-device.yaml / example-device-switches.yaml stay in sync
        run: python3 tools/check_example_sync.py
        working-directory: rs485_frame-examples
